<polygon points="560,205 573.5067065352902,198.47551698833155 573.5067065352902,211.52448301166845" fill="#455365"/>
<polyline points="295,365 295,340 16,340 16,205 30,205" fill="none" stroke="#455365" stroke-width="3"/>
<polygon points="30,205 16.493293464709847,211.52448301166845 16.493293464709847,198.47551698833155" fill="#455365"/>
<polyline points="640,480 560,480" fill="none" stroke="#455365" stroke-width="3"/>
<polygon points="560,480 573.5067065352902,473.47551698833155 573.5067065352902,486.52448301166845" fill="#455365"/>
<text x="600" y="910" font-family="Arial" font-size="25" font-weight="400" fill="#172231" text-anchor="middle" dominant-baseline="middle">Các FK user_id created_by_id reviewed_by_id tham chiếu auth_user.id</text>
<text x="600" y="950" font-family="Arial" font-size="25" font-weight="400" fill="#172231" text-anchor="middle" dominant-baseline="middle">conversation_id tham chiếu ai_chat_aichatsession.id; các cột đã được rút gọn</text>
