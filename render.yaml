services:
  - type: web
    name: uniconnect-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: tidb
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: CHAT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
